
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<!-- TensorFlow.js core -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>

<!-- TensorFlow WASM backend -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.16.0/dist/tf-backend-wasm.min.js"></script>

<!-- Configure WASM before loading Face API -->
<script>
  tf.wasm.setWasmPaths(
    "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.16.0/dist/"
  );
</script>

<!-- Face API without bundled TensorFlow -->
<script type="module">
  import * as faceapi from "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.esm-nobundle.js";

  window.faceapi = faceapi;

  await tf.setBackend("wasm");
  await tf.ready();

  console.log("TensorFlow backend:", tf.getBackend());

  window.dispatchEvent(new Event("faceapi-ready"));
</script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="script.js"></script>
